<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1780 860" width="1780" height="860" font-family="Times New Roman, Times, serif">
  <!-- EcoConsensus architecture. Plain shapes and text only: every block is a <g id="..."> group, edit freely. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .blk { stroke-width: 1.5; }
      .lbl { font-size: 22px; fill: #333; text-anchor: middle; dominant-baseline: middle; }
      .txt { font-size: 15px; fill: #333; }
      .small { font-size: 13px; fill: #444; }
      .cap { font-size: 17px; fill: #333; font-style: italic; text-anchor: middle; }
      .val { font-size: 15px; fill: #333; text-anchor: middle; dominant-baseline: middle; }
      .grp { fill: none; stroke: #9a9a9a; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .grpb { fill: none; stroke: #3c8c95; stroke-width: 2; stroke-dasharray: 10 7; }
      .line { fill: none; stroke: #333; stroke-width: 1.5; marker-end: url(#arrow); }
      .dline { fill: none; stroke: #777; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1780" height="860" fill="#ffffff"/>
  <text x="20" y="34" font-size="22" font-weight="bold" fill="#333">EcoConsensus: stance of a Hindi / Bengali comment toward "Climate change and global warming is a serious concern."</text>

  <!-- ===== Input ===== -->
  <g id="input">
    <path d="M20,320 h110 l24,24 v136 h-134 z" fill="#f4f6f8" stroke="#8a96a3" class="blk"/>
    <path d="M130,320 v24 h24" fill="none" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="87" y="365" class="txt" text-anchor="middle" font-weight="bold">input.csv</text>
    <text x="87" y="392" class="small" text-anchor="middle">Id, text</text>
    <text x="87" y="418" class="small" text-anchor="middle">Hindi / Bengali</text>
    <text x="87" y="438" class="small" text-anchor="middle">comment</text>
  </g>
  <path d="M164,400 h22 v-12 l22,12 l-22,12 v-12" fill="#f2b8b5" stroke="#d98c88" stroke-width="1.5"/>

  <!-- ===== Preprocessing ===== -->
  <g id="PP">
    <rect x="215" y="290" width="50" height="220" fill="#dbe7f8" stroke="#6f8fbf" class="blk"/>
    <text class="lbl" transform="translate(240 400) rotate(90)">PP</text>
  </g>
  <path class="line" d="M265,400 H288"/>

  <!-- ===== Sentence pair ===== -->
  <g id="pair">
    <rect x="290" y="330" width="115" height="140" rx="16" class="grp"/>
    <rect x="305" y="350" width="85" height="40" fill="#eef1f4" stroke="#8a96a3" class="blk"/>
    <text x="347" y="370" class="val">claim</text>
    <rect x="305" y="405" width="85" height="40" fill="#fbf6e9" stroke="#c9b27a" class="blk"/>
    <text x="347" y="425" class="val">comment</text>
    <text x="347" y="492" class="cap">(claim, comment)</text>
  </g>

  <!-- fan-out to the four components -->
  <path d="M405,400 H425" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M425,145 V665" fill="none" stroke="#333" stroke-width="1.5"/>
  <path class="line" d="M425,145 H468"/>
  <path class="line" d="M425,265 H468"/>
  <path class="line" d="M425,545 H468"/>
  <path class="line" d="M425,665 H468"/>

  <!-- ===== Fine-tuned transformers ===== -->
  <rect x="445" y="70" width="345" height="265" rx="18" class="grp"/>
  <text x="617" y="62" class="cap">fine-tuned encoders (LoRA)</text>
  <g id="MU">
    <rect x="470" y="95" width="46" height="100" fill="#f9e3b8" stroke="#d6a24a" class="blk"/>
    <text class="lbl" transform="translate(493 145) rotate(90)">MU</text>
  </g>
  <path class="line" d="M516,145 H578"/>
  <g id="p_MU">
    <rect x="580" y="95" width="190" height="100" rx="14" class="grpb"/>
    <rect x="600" y="104" width="150" height="24" fill="#e3dcef" stroke="#9887b8"/><text x="675" y="116" class="val">0.71</text>
    <rect x="600" y="133" width="150" height="24" fill="#f9e3b8" stroke="#d6a24a"/><text x="675" y="145" class="val">0.21</text>
    <rect x="600" y="162" width="150" height="24" fill="#f9e3b8" stroke="#d6a24a"/><text x="675" y="174" class="val">0.08</text>
  </g>
  <g id="IB">
    <rect x="470" y="215" width="46" height="100" fill="#d6ead2" stroke="#7aaa6e" class="blk"/>
    <text class="lbl" transform="translate(493 265) rotate(90)">IB</text>
  </g>
  <path class="line" d="M516,265 H578"/>
  <g id="p_IB">
    <rect x="580" y="215" width="190" height="100" rx="14" class="grpb"/>
    <rect x="600" y="224" width="150" height="24" fill="#e3dcef" stroke="#9887b8"/><text x="675" y="236" class="val">0.64</text>
    <rect x="600" y="253" width="150" height="24" fill="#d6ead2" stroke="#7aaa6e"/><text x="675" y="265" class="val">0.27</text>
    <rect x="600" y="282" width="150" height="24" fill="#d6ead2" stroke="#7aaa6e"/><text x="675" y="294" class="val">0.09</text>
  </g>
  <text x="675" y="352" class="small" text-anchor="middle">softmax: favour / neutral / against</text>

  <!-- ===== Zero-shot LLMs ===== -->
  <rect x="445" y="470" width="345" height="265" rx="18" class="grp"/>
  <text x="617" y="760" class="cap">zero-shot LLMs (prompt v3, temperature 0)</text>
  <g id="LA">
    <rect x="470" y="495" width="46" height="100" fill="#e3dcef" stroke="#9887b8" class="blk"/>
    <text class="lbl" transform="translate(493 545) rotate(90)">LA</text>
  </g>
  <path class="line" d="M516,545 H578"/>
  <g id="y_LA">
    <rect x="580" y="495" width="190" height="100" rx="14" class="grpb"/>
    <rect x="600" y="504" width="150" height="24" fill="#e3dcef" stroke="#9887b8"/><text x="675" y="516" class="val">1</text>
    <rect x="600" y="533" width="150" height="24" fill="#f4f6f8" stroke="#9887b8"/><text x="675" y="545" class="val">0</text>
    <rect x="600" y="562" width="150" height="24" fill="#f4f6f8" stroke="#9887b8"/><text x="675" y="574" class="val">0</text>
  </g>
  <g id="LB">
    <rect x="470" y="615" width="46" height="100" fill="#f6d8c4" stroke="#d08a5f" class="blk"/>
    <text class="lbl" transform="translate(493 665) rotate(90)">LB</text>
  </g>
  <path class="line" d="M516,665 H578"/>
  <g id="y_LB">
    <rect x="580" y="615" width="190" height="100" rx="14" class="grpb"/>
    <rect x="600" y="624" width="150" height="24" fill="#f6d8c4" stroke="#d08a5f"/><text x="675" y="636" class="val">1</text>
    <rect x="600" y="653" width="150" height="24" fill="#f4f6f8" stroke="#d08a5f"/><text x="675" y="665" class="val">0</text>
    <rect x="600" y="682" width="150" height="24" fill="#f4f6f8" stroke="#d08a5f"/><text x="675" y="694" class="val">0</text>
  </g>
  <text x="675" y="455" class="small" text-anchor="middle">one-hot label (none if no answer)</text>

  <!-- to feature concatenation -->
  <path class="line" d="M770,145 H848"/>
  <path class="line" d="M770,265 H848"/>
  <path class="line" d="M770,545 H848"/>
  <path class="line" d="M770,665 H848"/>

  <!-- ===== Feature concatenation ===== -->
  <g id="FC">
    <rect x="850" y="110" width="46" height="590" fill="#cdd5de" stroke="#7b8794" class="blk"/>
    <text class="lbl" transform="translate(873 405) rotate(90)">FC</text>
  </g>
  <path class="line" d="M896,405 H938"/>
  <g id="features">
    <rect x="940" y="215" width="110" height="380" rx="16" class="grp"/>
    <rect x="975" y="232" width="40" height="28" fill="#f9e3b8" stroke="#d6a24a"/>
    <rect x="975" y="260" width="40" height="28" fill="#f9e3b8" stroke="#d6a24a"/>
    <rect x="975" y="288" width="40" height="28" fill="#f9e3b8" stroke="#d6a24a"/>
    <rect x="975" y="316" width="40" height="28" fill="#d6ead2" stroke="#7aaa6e"/>
    <rect x="975" y="344" width="40" height="28" fill="#d6ead2" stroke="#7aaa6e"/>
    <rect x="975" y="372" width="40" height="28" fill="#d6ead2" stroke="#7aaa6e"/>
    <rect x="975" y="400" width="40" height="28" fill="#e3dcef" stroke="#9887b8"/>
    <rect x="975" y="428" width="40" height="28" fill="#e3dcef" stroke="#9887b8"/>
    <rect x="975" y="456" width="40" height="28" fill="#e3dcef" stroke="#9887b8"/>
    <rect x="975" y="484" width="40" height="28" fill="#f6d8c4" stroke="#d08a5f"/>
    <rect x="975" y="512" width="40" height="28" fill="#f6d8c4" stroke="#d08a5f"/>
    <rect x="975" y="540" width="40" height="28" fill="#f6d8c4" stroke="#d08a5f"/>
    <text x="995" y="618" class="cap">12 features</text>
  </g>
  <path class="line" d="M1050,405 H1098"/>

  <!-- ===== Meta-model with fallback ===== -->
  <g id="fallback">
    <rect x="1020" y="55" width="320" height="160" rx="16" class="grpb"/>
    <text x="1180" y="82" class="txt" text-anchor="middle" font-weight="bold">meta-model variant per comment</text>
    <text x="1180" y="106" class="small" text-anchor="middle">1. all four components</text>
    <text x="1180" y="125" class="small" text-anchor="middle">2. without LLM-A</text>
    <text x="1180" y="144" class="small" text-anchor="middle">3. without LLM-B</text>
    <text x="1180" y="163" class="small" text-anchor="middle">4. transformers only</text>
    <text x="1180" y="190" class="small" text-anchor="middle">(the first whose components all answered)</text>
  </g>
  <path class="line" d="M1123,215 V288"/>
  <g id="MM">
    <rect x="1100" y="290" width="46" height="230" fill="#f3d0d3" stroke="#c47b84" class="blk"/>
    <text class="lbl" transform="translate(1123 405) rotate(90)">MM</text>
  </g>
  <path class="line" d="M1146,405 H1188"/>
  <g id="S">
    <rect x="1190" y="330" width="150" height="150" rx="16" class="grpb"/>
    <rect x="1205" y="348" width="120" height="30" fill="#e3dcef" stroke="#9887b8"/><text x="1265" y="363" class="val">0.81</text>
    <rect x="1205" y="390" width="120" height="30" fill="#f9e3b8" stroke="#d6a24a"/><text x="1265" y="405" class="val">0.15</text>
    <rect x="1205" y="432" width="120" height="30" fill="#f9e3b8" stroke="#d6a24a"/><text x="1265" y="447" class="val">0.04</text>
    <text x="1265" y="320" class="cap">class probabilities</text>
  </g>
  <path class="line" d="M1340,405 H1378"/>
  <g id="AM">
    <rect x="1380" y="330" width="46" height="150" fill="#eef1f4" stroke="#8a96a3" class="blk"/>
    <text class="lbl" transform="translate(1403 405) rotate(90)">argmax</text>
  </g>
  <path class="line" d="M1426,405 H1468"/>

  <!-- ===== Output ===== -->
  <g id="output">
    <path d="M1470,310 h170 l24,24 v166 h-194 z" fill="#f4f6f8" stroke="#8a96a3" class="blk"/>
    <path d="M1640,310 v24 h24" fill="none" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="1567" y="345" class="txt" text-anchor="middle" font-weight="bold">output_04.csv</text>
    <text x="1505" y="380" class="small" font-weight="bold">Id</text><text x="1590" y="380" class="small" font-weight="bold">label</text>
    <line x1="1490" y1="388" x2="1645" y2="388" stroke="#aaa"/>
    <text x="1505" y="410" class="small">x9</text><text x="1590" y="410" class="small">2</text>
    <text x="1505" y="432" class="small">007</text><text x="1590" y="432" class="small">0</text>
    <text x="1505" y="454" class="small">…</text><text x="1590" y="454" class="small">…</text>
    <text x="1567" y="530" class="small" text-anchor="middle">0 = favour, 1 = neutral, 2 = against</text>
  </g>

  <!-- ===== TF-IDF fallback ===== -->
  <path d="M425,665 V800 H580" fill="none" stroke="#777" stroke-width="1.5" stroke-dasharray="6 5"/>
  <g id="TF">
    <rect x="580" y="780" width="110" height="40" fill="#ececec" stroke="#999" class="blk"/>
    <text x="635" y="800" class="lbl" font-size="18">TF</text>
  </g>
  <path class="dline" d="M690,800 H1165 V465 H1188"/>
  <text x="925" y="790" class="small" text-anchor="middle">used only when no transformer output exists for a comment</text>

  <!-- ===== LoRA inset (how MU and IB are fine-tuned) ===== -->
  <path class="dline" d="M450,325 Q425,450 395,548"/>
  <g id="lora">
    <rect x="20" y="550" width="390" height="220" rx="18" fill="#fbe9d7" stroke="#d6a24a" stroke-width="1.8" stroke-dasharray="9 6"/>
    <text x="215" y="575" class="txt" text-anchor="middle" font-weight="bold">LoRA fine-tuning of MU and IB</text>
    <rect x="40" y="595" width="120" height="44" fill="#e5e5e5" stroke="#999"/>
    <text x="100" y="611" class="small" text-anchor="middle">encoder W</text>
    <text x="100" y="629" class="small" text-anchor="middle">(frozen)</text>
    <polygon points="40,660 160,660 125,690 75,690" fill="#f9e3b8" stroke="#d6a24a"/>
    <text x="100" y="679" class="small" text-anchor="middle">A (r = 16)</text>
    <polygon points="75,700 125,700 160,730 40,730" fill="#f9e3b8" stroke="#d6a24a"/>
    <text x="100" y="721" class="small" text-anchor="middle">B</text>
    <circle cx="200" cy="665" r="14" fill="#ffffff" stroke="#333"/>
    <text x="200" y="666" class="val">+</text>
    <path class="line" d="M160,617 C180,620 192,635 196,651"/>
    <path class="line" d="M160,712 C180,709 192,695 196,679"/>
    <path class="line" d="M214,665 H246"/>
    <rect x="248" y="640" width="140" height="50" fill="#f3d0d3" stroke="#c47b84"/>
    <text x="318" y="659" class="small" text-anchor="middle">classifier + pooler</text>
    <text x="318" y="677" class="small" text-anchor="middle">(trained in full)</text>
    <text x="215" y="756" class="small" text-anchor="middle">trained on Pol-NLI train_base (9,968 rows)</text>
  </g>

  <!-- ===== Legend ===== -->
  <g id="legend" font-size="16">
    <rect x="1215" y="570" width="54" height="30" fill="#dbe7f8" stroke="#6f8fbf"/><text x="1242" y="586" class="val">PP</text>
    <text x="1280" y="591" class="txt">Preprocessing</text>
    <rect x="1215" y="615" width="54" height="30" fill="#f9e3b8" stroke="#d6a24a"/><text x="1242" y="631" class="val">MU</text>
    <text x="1280" y="636" class="txt">MuRIL + LoRA</text>
    <rect x="1215" y="660" width="54" height="30" fill="#d6ead2" stroke="#7aaa6e"/><text x="1242" y="676" class="val">IB</text>
    <text x="1280" y="681" class="txt">IndicBERT v2 + LoRA</text>
    <rect x="1215" y="705" width="54" height="30" fill="#e3dcef" stroke="#9887b8"/><text x="1242" y="721" class="val">LA</text>
    <text x="1280" y="726" class="txt">LLM-A: Gemini 3.5 Flash-Lite</text>
    <rect x="1505" y="570" width="54" height="30" fill="#f6d8c4" stroke="#d08a5f"/><text x="1532" y="586" class="val">LB</text>
    <text x="1570" y="591" class="txt">LLM-B: gpt-oss-20b (Groq)</text>
    <rect x="1505" y="615" width="54" height="30" fill="#cdd5de" stroke="#7b8794"/><text x="1532" y="631" class="val">FC</text>
    <text x="1570" y="636" class="txt">Feature concatenation</text>
    <rect x="1505" y="660" width="54" height="30" fill="#f3d0d3" stroke="#c47b84"/><text x="1532" y="676" class="val">MM</text>
    <text x="1570" y="681" class="txt">Meta-model (logistic regression)</text>
    <rect x="1505" y="705" width="54" height="30" fill="#ececec" stroke="#999"/><text x="1532" y="721" class="val">TF</text>
    <text x="1570" y="726" class="txt">TF-IDF + LR fallback</text>
  </g>
</svg>
