# Shared settings: paths, seed, labels, fixed claim, loader aliases, preprocessing noise list.
# Paths are relative to the project root.

seed: 42

fixed_claim: "Climate change and global warming is a serious concern."

# Final label ids (do not reorder): 0 favour, 1 neutral, 2 against.
labels: [favour, neutral, against]

# Raw label value (lower-cased, stripped) -> label name. Used by the evaluator loader and prepare_data.
label_map:
  "0": favour
  "1": neutral
  "2": against
  favour: favour
  favor: favour
  pro: favour
  support: favour
  neutral: neutral
  none: neutral
  irrelevant: neutral
  against: against
  con: against
  oppose: against

paths:
  raw: data/raw
  processed: data/processed
  bundle: data/ecoconsensus_data.zip     # uploaded to MyDrive/EcoConsensus/ on both Colab accounts
  models: models
  finetuned: models/finetuned
  baselines: models/finetuned/baselines
  meta_models: models/finetuned/meta
  outputs: outputs
  cache: outputs/llm/cache               # LLM answer cache + daily usage counters
  prompts: prompts

# Every script writes into its own folder: outputs/<component>/<kind>/
# (e.g. outputs/muril/predictions/probs_muril_val.csv, outputs/baselines/reports/baselines_report_<ts>.md).
outputs:
  components:
    prepare_data: data preparation (src/training/prepare_data.py)
    baselines: majority + TF-IDF baselines (src/baselines.py)
    muril: MuRIL LoRA (train_muril.ipynb on Colab; unzip muril_results.zip in the project root)
    indicbert: IndicBERT v2 LoRA (train_indicbert.ipynb on Colab)
    llm: LLM cache fills, pilots and prompt checks (src/training/run_llm_batch.py)
    ensemble: feature tables and meta-model training (train_inference.py, train_meta.py)
    evaluate: metrics and report for every model (src/evaluate.py)
    inference: inference.py (one comment, or a test file from data/test/ with the full report)
  kinds: [logs, metrics, predictions, reports]

splits:
  meta_fraction: 0.15        # share of Pol-NLI train source rows held out for the meta-model
  names: [train_base, meta, val, semeval_test]

mlflow:
  # one MLflow store per component: mlflow ui --backend-store-uri sqlite:///outputs/<component>/metrics/mlflow.db
  tracking_uri: sqlite:///outputs/{component}/metrics/mlflow.db

preprocessing:
  noise_patterns: ['#SemST\b']   # regexes removed before anything else (case-insensitive)
  drop_leading_rt: true          # "RT @x: ..." -> "@USER: ..."
  strip_hashtag_symbol: true     # "#climate" -> "climate"
  handle_token: "@USER"
  url_token: "URL"

# Column aliases for the flexible loader (matched after strip + lower-case; if no exact name matches, an alias found
# as a word in the column name also counts, singular or plural: 'Comment Text', 'Stance Label', 'Tweets').
aliases:
  id: [id, idx, index, sno, s.no, serial, comment_id]
  comment: [comment, text, tweet, premise, sentence, content, body, review_text, yt_comment, message, post, review]
  claim: [claim, target, topic, hypothesis, statement]
  label: [label, stance, class, category, gold, y]
  language: [language, lang]
