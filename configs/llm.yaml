# LLM layer. Provider, model, key, base URL and daily limit come from .env (LLM_A_*, LLM_B_*).
# Both components use the OpenAI-compatible chat-completions API (Groq, OpenRouter, Together, Mistral,
# Gemini's OpenAI endpoint, a local server, ...).

prompt_file: prompts/stance_system_prompt.md

# Set to true once the prompt is chosen on `val` (end of Day 2). run_llm_batch.py refuses to send
# semeval_test rows while this is false. After freezing, never edit the prompt; bump its version instead.
prompt_frozen: true

# Few-shot examples: ids from data/processed/train_base.csv (never meta / val / semeval_test).
# Empty list = zero-shot. Changing the list changes the cache key.
few_shot_ids: []

batch_size: 50              # default when LLM_BATCH_SIZE is not set in .env
min_batch_size: 5           # automatic shrinking on token-limit errors stops here
temperature: 0
request_timeout_sec: 120
max_retries: 5              # per request, for transient errors (429 per-minute, 5xx, timeouts)
backoff_base_sec: 2
backoff_cap_sec: 90
json_mode: false            # response_format=json_object cannot return a top-level array; keep off
extra_body: {}              # merged into every request body of both LLMs; per LLM use LLM_A_EXTRA_BODY / LLM_B_EXTRA_BODY in .env

# Output token limit per request = max_tokens_per_comment * comments + max_tokens_extra (capped). If a reply is cut off
# (finish_reason "length", typical for reasoning models such as gpt-oss) a reasoning allowance is added (256, then doubled)
# for the rest of the run. Groq counts prompt + max_tokens against its tokens-per-minute limit, so keep these small.
max_tokens_per_comment: 20
max_tokens_extra: 50
max_tokens_cap: 8192
reasoning_tokens: 0         # starting reasoning allowance; e.g. 256 for gpt-oss with reasoning_effort low
max_rate_limit_waits: 30    # per request: 429 per-minute waits before the run stops (rejected requests are not counted)

pilot:
  n_comments: 100
  batch_sizes: [10, 25, 50, 100]
